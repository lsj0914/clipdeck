name: Verify
on:
  push:
    branches: [main, feat/desktop-editor]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit and renderer checks (no native media runtime)
        run: npm test -- tests/domain tests/renderer tests/services/ipc.test.ts tests/services/ipc-native.test.ts tests/services/jobs.test.ts tests/services/process.test.ts tests/services/storage.test.ts tests/services/sentences.test.ts tests/services/media-protocol.test.ts tests/services/preparation.test.ts tests/scripts --maxWorkers=2
      - run: python3 -m unittest discover -s tests/packaging -p 'test_*.py'
      - run: npm run build
  fetch-resources:
    # Temporary draft bootstrap. A PR never receives this permission or runs its code here.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download explicit draft assets and verify locked identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/download-resources.py --tag resources-bootstrap-0.1.0 --output "$RUNNER_TEMP/clipdeck-resource-assets"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-resources
          path: ${{ runner.temp }}/clipdeck-resource-assets/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  native:
    needs: fetch-resources
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Record actual runner
        run: |
          test "$(uname -m)" = arm64
          mkdir -p ci-evidence
          sw_vers > ci-evidence/runner.txt
          uname -m >> ci-evidence/runner.txt
          node --version >> ci-evidence/runner.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-resources
          path: ${{ runner.temp }}/clipdeck-resource-assets/
      - run: npm ci
      - run: npm run prepare:electron
      - name: Prepare exact native runtime from verified archives
        run: python3 scripts/packaging/prepare_resources.py --assets-dir "$RUNNER_TEMP/clipdeck-resource-assets" --output .runtime --layout developer
      - name: Explicitly acquire and verify pinned CI model
        run: node scripts/ci/prepare-model.mjs > ci-evidence/model.json
      - name: Native suite (separate fixture-gated acceptance is reported as skipped)
        shell: bash
        run: |
          set -o pipefail
          npm test -- --maxWorkers=2 2>&1 | tee ci-evidence/tests.txt
      - name: Native offline instrumentation checks (Node test runner)
        run: node --test tests/packaging/offline_guard.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Sandboxed desktop smoke
        shell: bash
        run: |
          set -o pipefail
          npm run smoke:desktop 2>&1 | tee ci-evidence/desktop-smoke.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-verification
          path: ci-evidence/
          retention-days: 7
          if-no-files-found: error
